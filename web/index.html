<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0e1620" />
  <title>He A/C Remote</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="He A/C" />
  <style>
    :root {
      --bg: #0b0d10;
      --case-a: #2b3038; --case-b: #1d2128; --case-edge: #3a404b;
      --lcd-a: #c6d6b3; --lcd-b: #adbf99; --lcd-ink: #1b2a12; --lcd-dim: #5b6a4b;
      --btn-a: #343a44; --btn-b: #272c34; --btn-edge: #3d434e; --btn-ink: #eef2f7;
      --accent: #2fbf8f;
      --power: #d24b45; --power-on: #2fbf8f;
      --cap: #93a0af;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden;
      background: radial-gradient(120% 90% at 50% 0%, #151a23 0%, var(--bg) 70%);
      color: var(--btn-ink);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .stage {
      height: 100dvh; display: flex; justify-content: center; align-items: stretch;
      padding: calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
    }

    /* The remote body — a bordered, rounded case that nearly fills the screen on
       mobile (top and bottom edges visible) and is a centered card on desktop.
       Surfaces are matte with layered soft shadows, not hard bevels. */
    .remote {
      width: 100%; max-width: 380px; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
      gap: 14px; padding: 22px 20px 20px;
      background: linear-gradient(180deg, var(--case-a), var(--case-b));
      border: 1px solid rgba(255,255,255,.06); border-radius: 30px;
      box-shadow: 0 26px 60px -14px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.5);
    }
    @media (min-width: 460px) {
      .stage { align-items: center; padding: 28px; }
      .remote {
        min-height: 0; max-height: calc(100dvh - 56px); border-radius: 30px;
        box-shadow: 0 34px 70px -18px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
      }
    }
    .remote.asleep { filter: saturate(.6) brightness(.96); }

    /* Source + license links — a quiet footer pinned to the base of the case so
       it stays visible when the pad scrolls. */
    .source {
      flex: none; margin-top: 2px; text-align: center;
      font-size: 11px; letter-spacing: .04em; color: #8a93a1; opacity: .75;
    }
    .source a { text-decoration: none; color: inherit; }
    .source a:hover { opacity: 1; text-decoration: underline; }
    .source .sep { margin: 0 6px; opacity: .5; }

    /* Status bar: indicator LED + Bluetooth logo + device name + menu, and brand. */
    .statusbar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .indicator {
      display: inline-flex; align-items: center; gap: 8px; padding: 5px 8px; cursor: pointer;
      background: rgba(255,255,255,.04); border: 1px solid var(--case-edge); border-radius: 10px;
      color: var(--btn-ink); font: inherit; min-width: 0; max-width: 260px;
    }
    .indicator:active { transform: translateY(1px); }
    .devname { font-size: 12px; color: #c3ccd6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .caret { font-size: 10px; color: var(--cap); }
    .bt-logo { width: 16px; height: 16px; opacity: .85; display: block; flex: none; }

    /* Device menu (switch / add) */
    .overlay { position: fixed; inset: 0; z-index: 20; }
    .devmenu {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 21; min-width: 200px; max-width: 300px;
      background: linear-gradient(180deg, #262a31, #1c1f25); border: 1px solid var(--case-edge);
      border-radius: 12px; padding: 6px; box-shadow: 0 16px 34px rgba(0,0,0,.55);
      display: flex; flex-direction: column; gap: 2px;
    }
    .devmenu-empty { padding: 10px 12px; font-size: 12px; color: var(--cap); }
    .devrow-wrap { display: flex; flex-direction: column; }
    .pkrow {
      display: flex; align-items: center; gap: 8px; padding: 4px 10px 8px 26px; font-size: 12px;
    }
    .pk-label { color: var(--cap); }
    .pk-value { font-family: monospace; letter-spacing: 3px; color: #c3ccd6; min-width: 44px; }
    .pk-btn {
      margin-left: auto; background: rgba(255,255,255,.06); border: 1px solid var(--case-edge);
      color: var(--btn-ink); font: inherit; font-size: 11px; padding: 4px 9px; border-radius: 7px; cursor: pointer;
    }
    .pk-btn:hover { background: rgba(255,255,255,.1); }
    .pk-btn + .pk-btn { margin-left: 6px; }
    .devrow { display: flex; align-items: center; border-radius: 8px; }
    .devrow.sel { background: rgba(22,160,111,.16); }
    .devrow-pick {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 9px 10px;
      background: none; border: 0; color: var(--btn-ink); font: inherit; cursor: pointer; border-radius: 8px;
    }
    .devrow-pick:hover { background: rgba(255,255,255,.05); }
    .devrow-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.ok { background: #2ee27a; box-shadow: 0 0 6px rgba(46,226,122,.7); }
    .dot.off { background: #5a6470; }
    .devrow-x {
      background: none; border: 0; color: var(--cap); font-size: 18px; line-height: 1; cursor: pointer;
      padding: 6px 10px; border-radius: 8px;
    }
    .devrow-x:hover { color: #e88; background: rgba(255,255,255,.05); }
    .devmenu-add {
      margin-top: 2px; padding: 10px 10px; background: none; border: 0; border-top: 1px solid var(--case-edge);
      color: var(--accent); font: inherit; font-weight: 600; text-align: left; cursor: pointer; border-radius: 0 0 8px 8px;
    }
    .devmenu-add:hover { background: rgba(22,160,111,.12); }
    .led {
      width: 11px; height: 11px; border-radius: 50%;
      background: #555; box-shadow: inset 0 0 3px rgba(0,0,0,.6);
    }
    .led.btConnected { background: #2ee27a; box-shadow: 0 0 8px 1px rgba(46,226,122,.75), inset 0 0 2px rgba(255,255,255,.6); }
    .led.btDisconnected { background: #6b2b28; box-shadow: inset 0 0 3px rgba(0,0,0,.7); }
    .led.btPairing { background: #f2b23a; box-shadow: 0 0 8px 1px rgba(242,178,58,.8); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .25; box-shadow: none; } }
    .brand { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 3px; color: #8a929d; }
    .brand-logo { width: 18px; height: 18px; display: block; border-radius: 4px; }

    /* LCD display */
    .lcd {
      background: linear-gradient(160deg, var(--lcd-a), var(--lcd-b));
      color: var(--lcd-ink); border-radius: 16px; padding: 16px 18px;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.25), 0 1px 0 rgba(255,255,255,.06);
      font-family: "DIN Alternate", "Roboto Condensed", "Arial Narrow", monospace;
      display: flex; flex-direction: column; gap: 6px; min-height: 168px; justify-content: space-between;
      transition: filter 1.1s ease, background 1.1s ease;
    }
    /* Backlight timed out — the LCD goes dark like a real remote's after a minute idle. */
    .lcd.dark { filter: brightness(.42) saturate(.8) contrast(.95); }
    .lcd-top, .lcd-bot { display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
    .lcd-top { font-size: 15px; letter-spacing: 1px; }
    .lcd .seg { opacity: .35; }
    .lcd .seg.on { opacity: 1; }
    .lcd .room { font-size: 14px; opacity: .8; }
    .lcd-main { display: flex; align-items: flex-start; justify-content: center; gap: 4px; }
    .lcd .temp {
      font-size: 84px; font-weight: 800; line-height: .82; letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }
    .lcd .deg { font-size: 22px; font-weight: 700; margin-top: 8px; }
    .lcd-bot { font-size: 13px; letter-spacing: .5px; gap: 8px; }
    .lcd .field { display: inline-flex; align-items: center; gap: 6px; opacity: .45; }
    .lcd .field.on { opacity: 1; }
    .lcd .field.watts { opacity: .9; }
    .lcd .field.muted { opacity: .5; }
    .lcd .lbl { font-size: 10px; opacity: .8; }
    .lcd .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
    .lcd .bars.auto { font-size: 12px; font-weight: 700; }
    .lcd .bar { width: 4px; height: 5px; background: var(--lcd-dim); border-radius: 1px; }
    .lcd .bar:nth-child(2) { height: 8px; }
    .lcd .bar:nth-child(3) { height: 12px; }
    .lcd .bar.on { background: var(--lcd-ink); }

    /* Button pad — takes the slack so the case fits the viewport; scrolls
       internally on very short screens rather than pushing the footer off. */
    .pad { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end; }
    .pad.connect, .pad.pinpad { align-items: center; justify-content: center; gap: 18px; }
    .pad.grid {
      display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 12px;
    }
    .btn {
      font: inherit; cursor: pointer; color: var(--btn-ink);
      background: linear-gradient(180deg, var(--btn-a), var(--btn-b));
      border: 1px solid rgba(255,255,255,.05); border-radius: 18px;
      box-shadow: 6px 6px 14px rgba(0,0,0,.45), -4px -4px 10px rgba(255,255,255,.035), inset 0 1px 0 rgba(255,255,255,.09);
      padding: 14px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      transition: transform .08s ease, box-shadow .18s ease, background .2s ease, outline-color .2s ease, filter .2s ease;
    }
    .btn .glyph { font-size: 22px; line-height: 1; transition: color .28s ease, text-shadow .28s ease; }
    .btn .cap { font-size: 10px; letter-spacing: 1.5px; color: var(--cap); transition: color .28s ease; }
    /* Activated: the moment of pressing — the key sinks into its socket. */
    .btn:active {
      transform: translateY(1px) scale(.985);
      filter: none;
      box-shadow: inset 5px 5px 12px rgba(0,0,0,.55), inset -4px -4px 10px rgba(255,255,255,.03);
      transition-duration: .05s, .05s, .05s, .05s, .05s;
    }
    /* Currently active toggle (power on / swing on) — a lit, glowing state that
       fades in on activate and fades out on deactivate. */
    .btn.on {
      outline: none;
      background: linear-gradient(180deg, #20463b, #1a3830);
      box-shadow: 6px 6px 14px rgba(0,0,0,.45), -4px -4px 10px rgba(255,255,255,.03), inset 0 0 0 1.5px rgba(47,191,143,.55), 0 0 24px -5px rgba(47,191,143,.55);
      animation: activate .3s ease;
    }
    .btn.on .glyph { color: #57e0ad; text-shadow: 0 0 10px rgba(87,224,173,.5); }
    .btn.on .cap { color: #bff0dd; }
    @keyframes activate { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
    .btn.power { background: linear-gradient(180deg, #d9605a, #b03b36); border-color: rgba(255,255,255,.12); }
    .btn.power .cap { color: #ffe3e0; }
    .btn.power .glyph { color: #fff; }
    .btn.power.on { background: linear-gradient(180deg, #2fbf8f, #1f9d75); border-color: rgba(255,255,255,.14); box-shadow: 6px 6px 14px rgba(0,0,0,.45), -4px -4px 10px rgba(255,255,255,.03), 0 0 24px -4px rgba(47,191,143,.65); }
    .btn.power.on .cap { color: #d9fff0; }
    .btn.power.on .glyph { color: #fff; text-shadow: 0 0 12px rgba(255,255,255,.5); }
    .btn.ghost { background: linear-gradient(180deg, #30343c, #23262c); }
    .btn.big { width: 100%; padding: 18px; font-size: 17px; font-weight: 700; letter-spacing: 2px; }

    /* Temp rocker spans both grid rows on the right of power */
    .rocker {
      grid-row: span 2; display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    }
    .rocker .btn { flex: 1; font-size: 30px; font-weight: 300; }
    .rocker-lbl { text-align: center; font-size: 10px; letter-spacing: 2px; color: var(--cap); }

    .pin {
      font-size: 34px; letter-spacing: 16px; text-align: center; text-indent: 16px;
      width: 190px; padding: 12px; border-radius: 12px; border: 1px solid var(--btn-edge);
      background: linear-gradient(150deg, var(--lcd-a), var(--lcd-b)); color: var(--lcd-ink);
      font-weight: 800; font-family: monospace;
    }
    .err {
      background: #2a1512; color: #f6c9c2; border: 1px solid #5a241d;
      padding: 9px 12px; border-radius: 10px; font-size: 13px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
        // When a new service worker takes control (new deploy), reload once so the
        // fresh build shows immediately instead of the previous one.
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        });
      });
    }
  </script>
</body>
</html>
